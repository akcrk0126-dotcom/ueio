<title>저승길 부적</title>
<meta name="description" content="부적 카드로 덱을 쌓아 저승차사를 물리치는 덱빌딩 로그라이크">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* Layout: one night-road column — top status bar, then the current scene (map / battle / shop), hand of talisman cards pinned under the battle. Single dark world by choice. */
:root {
  color-scheme: dark;
  --night: #10121b;
  --night-2: #191c2a;
  --night-3: #242a3d;
  --line: #363d57;
  --fg: #ece4cf;
  --muted: #9b97ab;
  --hanji: #ecd894;
  --hanji-2: #d9bf6f;
  --cinnabar: #c63a2e;
  --cinnabar-2: #e2574a;
  --ink: #2a2018;
  --indigo-ink: #24346a;
  --violet-ink: #5b2f6e;
  --jade: #5fae98;
  --gold: #e3b04f;
  --poison: #93c552;
  --f-display: "East Sea Dokdo", "Nanum Brush Script", cursive;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-glyph: "Noto Serif KR", "Batang", "Songti SC", serif;
  --cw: 116px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 70% 40% at 80% -5%, rgba(236, 216, 148, .10), transparent 70%),
    radial-gradient(ellipse 60% 50% at 0% 100%, rgba(198, 58, 46, .08), transparent 70%),
    var(--night);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
}
#app { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.btn {
  border: 1px solid var(--hanji-2); background: var(--hanji); color: var(--ink);
  padding: .55em 1.2em; border-radius: 3px; font-weight: 700; letter-spacing: .02em;
  box-shadow: 0 2px 0 var(--hanji-2);
}
.btn:hover:not(:disabled) { background: #f4e3a8; }
.btn:disabled { opacity: .45; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: var(--night-3); }
.btn.red { background: var(--cinnabar); color: var(--hanji); border-color: #8f2a21; box-shadow: 0 2px 0 #8f2a21; }
.btn.red:hover:not(:disabled) { background: var(--cinnabar-2); }
.btn.small { padding: .3em .8em; font-size: 13px; }

/* top bar */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding-block: 8px; margin-bottom: 14px; border-bottom: 1px solid var(--line);
}
.stat { font-size: 14px; }
.stat b { color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: .08em; margin-right: 4px; }
.stat.hp .num { color: var(--cinnabar-2); font-weight: 700; }
.stat.gold .num { color: var(--gold); font-weight: 700; }
.relics { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.relic {
  width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--gold);
  background: var(--night-2); color: var(--gold); font-family: var(--f-glyph); font-weight: 900; font-size: 15px; padding: 0;
}

/* title */
.title { display: grid; gap: 28px; justify-items: center; text-align: center; padding-block: 28px 8px; }
.title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(72px, 16vw, 128px); line-height: .9; color: var(--hanji); letter-spacing: .04em; }
.title h1 span { color: var(--cinnabar-2); }
.title .sub { color: var(--muted); max-width: 32em; }
.fan { display: flex; justify-content: center; padding-block: 8px 12px; }
.fan .card { margin-inline: -14px; }
.fan .card:nth-child(1) { transform: rotate(-9deg) translateY(10px); }
.fan .card:nth-child(3) { transform: rotate(9deg) translateY(10px); }
.title .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.how { text-align: left; max-width: 36em; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 16px; }
.how dt { color: var(--fg); font-weight: 700; margin-top: 8px; }
.how dd { margin: 0; }

/* card */
.card {
  --tone: var(--cinnabar);
  width: var(--cw); height: calc(var(--cw) * 1.48); flex: none; position: relative;
  border: 0; border-radius: 2px; padding: 22px 8px 8px; color: var(--ink);
  background:
    repeating-linear-gradient(0deg, rgba(42, 32, 24, .035) 0 2px, transparent 2px 5px),
    linear-gradient(170deg, #f2e1a2, var(--hanji) 45%, var(--hanji-2));
  box-shadow: inset 0 0 0 4px transparent, inset 0 0 0 5.5px var(--tone), 0 6px 14px rgba(0, 0, 0, .45);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
}
.card.t-skl { --tone: var(--indigo-ink); }
.card.t-pow { --tone: var(--violet-ink); }
.card.t-curse { --tone: #555; background: linear-gradient(170deg, #9c9483, #7a7366); }
.card .cost {
  position: absolute; top: -8px; left: -8px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--tone); color: var(--hanji); font-weight: 700; font-size: 16px;
  display: grid; place-items: center; box-shadow: 0 0 0 2px var(--night);
}
.card .cname { font-weight: 700; font-size: 13.5px; line-height: 1.2; color: var(--tone); }
.card.up .cname::after { content: "+"; color: #2f7d4f; }
.card .glyph { font-family: var(--f-glyph); font-weight: 900; font-size: calc(var(--cw) * .42); line-height: 1.15; color: var(--tone); opacity: .9; flex: 1; display: grid; place-items: center; }
.card .cdesc { font-size: 11.5px; line-height: 1.35; min-height: 3.6em; }
.card .ctype { position: absolute; bottom: -8px; font-size: 10px; letter-spacing: .1em; background: var(--tone); color: var(--hanji); padding: 0 6px; border-radius: 2px; }
.hand .card:hover:not(.off), .pick .card:hover { transform: translateY(-8px); }
.card.sel { transform: translateY(-16px); box-shadow: inset 0 0 0 4px transparent, inset 0 0 0 5.5px var(--tone), 0 0 0 3px var(--gold), 0 10px 22px rgba(0, 0, 0, .55); }
.card.off { opacity: .55; filter: saturate(.6); }

/* map */
.scene-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.scene-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 40px; color: var(--hanji); line-height: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.legend span b { font-family: var(--f-glyph); color: var(--fg); margin-right: 3px; }
.mapwrap { max-height: min(68vh, 620px); overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; background: rgba(25, 28, 42, .6); }
.map { position: relative; max-width: 440px; margin: 0 auto; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map line { stroke: var(--line); stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.map line.on { stroke: var(--hanji-2); }
.map line.done { stroke: var(--cinnabar); stroke-dasharray: none; }
.node {
  position: absolute; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--night-2); color: var(--muted);
  font-family: var(--f-glyph); font-weight: 900; font-size: 19px; padding: 0; display: grid; place-items: center;
}
.node.t-elite { color: var(--cinnabar-2); }
.node.t-boss { width: 64px; height: 64px; font-size: 32px; border-color: var(--cinnabar); color: var(--cinnabar-2); }
.node.av { background: var(--hanji); color: var(--cinnabar); border-color: var(--hanji); animation: pulse 1.6s ease-in-out infinite; }
.node.av:hover { transform: translate(-50%, -50%) scale(1.12); }
.node.done { background: var(--cinnabar); color: var(--hanji); border-color: var(--cinnabar); opacity: .8; }
.node.here { box-shadow: 0 0 0 3px var(--gold); opacity: 1; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(236, 216, 148, .18); } }

/* combat */
.arena { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; min-height: 230px; padding-block: 8px; }
.mine { flex: 0 1 200px; }
.foes { flex: 1 1 300px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: flex-end; }
.ent { position: relative; width: 150px; padding: 10px; border-radius: 4px; text-align: center; display: grid; gap: 4px; justify-items: center; border: 1px solid transparent; }
.ent.big { width: 180px; }
.foe.targetable { border-color: var(--gold); background: rgba(227, 176, 79, .08); cursor: crosshair; }
.foe.acting .seal { box-shadow: 0 0 0 4px var(--cinnabar-2); }
.seal {
  width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-glyph); font-weight: 900; font-size: 40px; color: var(--hanji);
  background: radial-gradient(circle at 35% 30%, #34384f, var(--night-2)); border: 2px solid var(--line);
  transition: box-shadow .2s;
}
.big .seal { width: 92px; height: 92px; font-size: 52px; border-color: var(--cinnabar); color: var(--cinnabar-2); }
.me-seal { color: var(--gold); border-color: var(--gold); }
.ename { font-weight: 700; font-size: 14px; }
.hpbar { position: relative; width: 100%; height: 16px; background: #2b1a1d; border-radius: 2px; overflow: visible; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(var(--cinnabar-2), var(--cinnabar)); border-radius: 2px; transition: width .3s; }
.hpbar span { position: relative; font-size: 11px; line-height: 16px; color: #fff; text-shadow: 0 1px 1px #000; }
.hpbar em { position: absolute; left: -12px; top: -6px; font-style: normal; min-width: 26px; height: 26px; padding: 0 4px; display: grid; place-items: center; border-radius: 6px 6px 13px 13px; background: var(--jade); color: var(--night); font-weight: 700; font-size: 12px; }
.blocked .hpbar i { background: linear-gradient(#7cc5b0, var(--jade)); }
.sts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 20px; }
.chip { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid; line-height: 17px; }
.chip.buff { color: var(--gold); border-color: rgba(227, 176, 79, .5); }
.chip.debuff { color: var(--cinnabar-2); border-color: rgba(226, 87, 74, .5); }
.chip.poison { color: var(--poison); border-color: rgba(147, 197, 82, .5); }
.chip.pw { color: #c9a6e6; border-color: rgba(201, 166, 230, .45); }
.intent { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center; min-height: 26px; }
.intent span { font-family: var(--f-glyph); font-weight: 700; font-size: 13px; padding: 1px 6px; border-radius: 3px; background: var(--night-3); }
.intent .i-atk { color: var(--cinnabar-2); }
.intent .i-def { color: var(--jade); }
.intent .i-buf { color: var(--gold); }
.intent .i-deb { color: #c9a6e6; }
.intent small { width: 100%; color: var(--muted); font-size: 11px; }
.hint { min-height: 22px; text-align: center; color: var(--gold); font-size: 13px; }
.hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.energy {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; align-content: center;
  background: radial-gradient(circle at 40% 35%, var(--cinnabar-2), var(--cinnabar) 60%, #7d2219);
  color: var(--hanji); box-shadow: 0 0 18px rgba(198, 58, 46, .45);
}
.energy > span { font-size: 24px; font-weight: 700; line-height: 1; }
.energy small { font-size: 11px; opacity: .8; line-height: 1; }
.pile { background: none; border: 1px solid var(--line); border-radius: 3px; padding: .35em .7em; font-size: 13px; color: var(--muted); }
.pile b { color: var(--fg); }
.btn.end { margin-left: auto; }
.hand { display: flex; gap: 10px; overflow-x: auto; padding: 32px 12px 18px; min-height: calc(var(--cw) * 1.48 + 44px); }
.hand .empty { color: var(--muted); margin: auto; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.hit .seal { animation: shake .3s; }
#fxl { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.float { position: fixed; transform: translate(-50%, 0); font-weight: 700; font-size: 20px; text-shadow: 0 2px 3px #000; animation: rise .9s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #ff7b6e; font-size: 24px; }
.float.blk { color: var(--jade); }
.float.heal { color: var(--poison); }
.float.buff { color: var(--gold); font-size: 15px; }
.float.debuff { color: #c9a6e6; font-size: 15px; }
@keyframes rise { to { transform: translate(-50%, -42px); opacity: 0; } }

/* panels: reward, rest, shop, event */
.panel { max-width: 640px; margin: 12px auto 0; display: grid; gap: 16px; }
.panel h2 { font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: 1; color: var(--hanji); }
.panel p.lead { color: var(--muted); margin: 0; max-width: 36em; }
.list { display: grid; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--night-2); text-align: left; width: 100%;
}
.row:hover:not(:disabled) { border-color: var(--hanji-2); }
.row:disabled { opacity: .45; }
.row .ic { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-glyph); font-weight: 900; font-size: 19px; background: var(--night-3); color: var(--gold); }
.row .tx { flex: 1; min-width: 0; }
.row .tx small { display: block; color: var(--muted); font-size: 12.5px; }
.row .price { color: var(--gold); font-weight: 700; }
.pick { display: flex; flex-wrap: wrap; gap: 18px 14px; justify-content: center; padding-block: 12px; }
.pick > div { display: grid; gap: 10px; justify-items: center; }
.price-tag { font-size: 13px; color: var(--gold); font-weight: 700; }
.price-tag.no { color: var(--muted); }
.sold { opacity: .3; pointer-events: none; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.choice { display: grid; gap: 6px; justify-items: start; padding: 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--night-2); text-align: left; }
.choice:hover:not(:disabled) { border-color: var(--hanji-2); }
.choice:disabled { opacity: .45; }
.choice .ic { font-family: var(--f-glyph); font-weight: 900; font-size: 34px; color: var(--hanji); line-height: 1; }
.choice small { color: var(--muted); }
.event-glyph { font-family: var(--f-glyph); font-weight: 900; font-size: 64px; color: var(--cinnabar-2); line-height: 1; }
.endcard { text-align: center; justify-items: center; padding-block: 24px; }
.endcard .event-glyph { font-size: 96px; }
.tally { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; color: var(--muted); }
.tally b { display: block; color: var(--fg); font-size: 22px; }

/* modal + toast */
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(8, 9, 14, .86); overflow-y: auto; padding: 24px 16px; }
#modal .inner { max-width: 900px; margin: 0 auto; display: grid; gap: 12px; }
#modal h3 { font-family: var(--f-display); font-weight: 400; font-size: 36px; color: var(--hanji); }
#modal .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--night-3); border: 1px solid var(--hanji-2); color: var(--fg); padding: 8px 16px; border-radius: 4px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 560px) {
  :root { --cw: 96px; }
  .ent { width: 128px; padding: 6px; }
  .ent.big { width: 150px; }
  .seal { width: 58px; height: 58px; font-size: 32px; }
  .big .seal { width: 76px; height: 76px; font-size: 42px; }
  .mine { flex-basis: 100%; display: flex; justify-content: flex-start; order: 2; }
  .foes { justify-content: center; }
  .card .cdesc { font-size: 10.5px; }
  .card .cname { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div id="app"></div>
<div id="fxl" aria-hidden="true"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- utils ---------- */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SAVE_KEY = 'jeoseunggil-run-v1';
let G = null;
let pickCb = null;

/* ---------- data ---------- */
const TYPE = { atk: '공격', skl: '기술', pow: '능력', curse: '저주' };
const ST = {
  str: ['힘', 'buff', '공격 피해가 수치만큼 증가'],
  dex: ['민첩', 'buff', '카드로 얻는 방어도가 수치만큼 증가'],
  ritual: ['의식', 'buff', '매 턴 시작 시 힘이 수치만큼 증가'],
  weak: ['약화', 'debuff', '주는 공격 피해 25% 감소 (턴마다 1 감소)'],
  vuln: ['취약', 'debuff', '받는 공격 피해 50% 증가 (턴마다 1 감소)'],
  poison: ['독', 'poison', '턴 시작 시 수치만큼 체력을 잃고 1 감소'],
};
const PW = { fumes: '독무', armor: '금강신', barricade: '부동명왕', club: '방망이' };

const CARDS = {
  strike:   { n: '베기', g: '斬', t: 'atk', r: 'b', c: 1, tg: 1, d: u => `피해 ${u ? 9 : 6}`, p: (T, u) => hit(T, u ? 9 : 6) },
  defend:   { n: '막기', g: '防', t: 'skl', r: 'b', c: 1, d: u => `방어도 ${u ? 8 : 5}`, p: (T, u) => guard(u ? 8 : 5) },
  ward:     { n: '액막이', g: '厄', t: 'skl', r: 'b', c: 0, d: u => `방어도 ${u ? 5 : 3}<br>카드 1장 뽑기`, p: (T, u) => { guard(u ? 5 : 3); draw(1); } },
  twin:     { n: '연타', g: '連', t: 'atk', r: 'c', c: 1, tg: 1, d: u => `피해 ${u ? 7 : 5} × 2`, p: (T, u) => { hit(T, u ? 7 : 5); hit(T, u ? 7 : 5); } },
  bash:     { n: '강타', g: '擊', t: 'atk', r: 'c', c: 2, tg: 1, d: u => `피해 ${u ? 10 : 8}<br>취약 ${u ? 3 : 2}`, p: (T, u) => { hit(T, u ? 10 : 8); debuff(T, 'vuln', u ? 3 : 2); } },
  cleave:   { n: '휩쓸기', g: '掃', t: 'atk', r: 'c', c: 1, d: u => `모든 적에게<br>피해 ${u ? 11 : 8}`, p: (T, u) => hitAll(u ? 11 : 8) },
  shrug:    { n: '호신부', g: '護', t: 'skl', r: 'c', c: 1, d: u => `방어도 ${u ? 11 : 8}<br>카드 1장 뽑기`, p: (T, u) => { guard(u ? 11 : 8); draw(1); } },
  stab:     { n: '독침', g: '針', t: 'atk', r: 'c', c: 1, tg: 1, d: u => `피해 ${u ? 8 : 6}<br>독 ${u ? 4 : 3}`, p: (T, u) => { hit(T, u ? 8 : 6); debuff(T, 'poison', u ? 4 : 3); } },
  fog:      { n: '독안개', g: '霧', t: 'skl', r: 'c', c: 1, d: u => `모든 적에게<br>독 ${u ? 6 : 4}`, p: (T, u) => alive().forEach(e => debuff(e, 'poison', u ? 6 : 4)) },
  daunt:    { n: '기 꺾기', g: '威', t: 'skl', r: 'c', c: 1, tg: 1, d: u => `약화 ${u ? 3 : 2}<br>취약 ${u ? 3 : 2}`, p: (T, u) => { debuff(T, 'weak', u ? 3 : 2); debuff(T, 'vuln', u ? 3 : 2); } },

const ENC = {

const RELICS = {

const NODE = {
  fight: { g: '戰', n: '전투' }, elite: { g: '鬼', n: '정예' }, rest: { g: '休', n: '휴식' },

/* ---------- run setup ---------- */
function mk(id, up = false) { return { u: G.uid++, id, up }; }
function newRun() {
  G = {
    uid: 1, screen: 'map',
    p: { hp: 72, max: 72, gold: 99, block: 0, st: {}, pw: {} },
    deck: [], relics: [], map: genMap(), pos: { r: -1, c: -1 }, path: [],
    combat: null, reward: null, shop: null, event: null, stats: { kills: 0, cards: 0 },
  };
  for (let i = 0; i < 5; i++) G.deck.push(mk('strike'));
  for (let i = 0; i < 4; i++) G.deck.push(mk('defend'));
  G.deck.push(mk('ward'));
  gainRelic('gourd');
  render();
}
function rollType(r) {
  if (r === 0) return 'fight';
  if (r === 5) return 'chest';
  if (r === 11) return 'rest';
  const w = [['fight', 45], ['event', 22], ['shop', 9]];
  if (r >= 4) w.push(['elite', 12], ['rest', 12]);
  let x = Math.random() * w.reduce((s, a) => s + a[1], 0);
  for (const [t, n] of w) { if ((x -= n) < 0) return t; }
  return 'fight';
}
function genMap() {
  const rows = [];
  for (let r = 0; r < 13; r++) {
    const row = [null, null, null];
    if (r === 12) { row[1] = { t: 'boss', dx: 0 }; rows.push(row); continue; }
    const cols = [0, 1, 2];
    if (r > 0 && r !== 5 && r !== 11 && Math.random() < .45) cols.splice(rnd(3), 1);
    cols.forEach(c => { row[c] = { t: rollType(r), dx: (Math.random() - .5) * 9 }; });
    rows.push(row);
  }
  return rows;
}
function avail() {
  const { r, c } = G.pos, nr = r + 1;
  if (nr >= G.map.length) return [];
  return G.map[nr].map((n, cc) => (n && (r < 0 || Math.abs(cc - c) <= 1)) ? cc : -1).filter(x => x >= 0);
}
function gainRelic(id) { if (!id || has(id)) return; G.relics.push(id); RELICS[id].get?.(); }
function randomRelic() { const pool = Object.keys(RELICS).filter(k => k !== 'gourd' && !has(k)); return pool.length ? pick(pool) : null; }
function rollRarity(rare) { const x = Math.random(); return x < rare ? 'r' : x < rare + .35 ? 'u' : 'c'; }
function cardChoices(n, kind) {
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 100) {
    const rar = kind === 'rare' ? 'r' : rollRarity(kind === 'elite' ? .2 : .07);
    const id = pick(Object.keys(CARDS).filter(k => CARDS[k].r === rar));
    if (!out.some(c => c.id === id)) out.push(mk(id));
  }
  return out;
}

/* ---------- combat core ---------- */
const alive = () => G.combat.en.filter(e => e.hp > 0);
const eid = t => t === G.p ? 'pl' : t.u;
function fx(t, txt, cls) { if (G.combat) G.combat.fx.push({ id: eid(t), txt, cls }); }
function calc(src, tgt, base, sm = 1) {
  let d = base + (src.st.str || 0) * sm;
  if (src.st.weak) d *= .75;
  if (tgt.st.vuln) d *= 1.5;
  return Math.max(0, Math.floor(d));
}
function dmgTo(t, amt) {
  const b = Math.min(t.block, amt);
  t.block -= b;
  const un = amt - b;
  t.hp -= un;
  fx(t, un > 0 ? `-${un}` : '막음', un > 0 ? 'dmg' : 'blk');
  if (t !== G.p && t.hp <= 0 && !t.dead) { t.dead = true; G.stats.kills++; }
  return un;
}
function hit(T, base, sm = 1) { if (!T || T.hp <= 0) return 0; return dmgTo(T, calc(G.p, T, base, sm)); }
function hitAll(base) { return alive().reduce((s, e) => s + hit(e, base), 0); }
function guard(n) { const v = Math.max(0, n + (G.p.st.dex || 0)); G.p.block += v; fx(G.p, `+${v}`, 'blk'); }
function heal(n) { if (n <= 0) return; const v = Math.min(n, G.p.max - G.p.hp); G.p.hp += v; if (v > 0) fx(G.p, `+${v}`, 'heal'); }
function buff(t, k, n) { t.st[k] = (t.st[k] || 0) + n; fx(t, `${ST[k][0]} +${n}`, 'buff'); }
function debuff(t, k, n) { if (!t || t.hp <= 0) return; t.st[k] = (t.st[k] || 0) + n; fx(t, `${ST[k][0]} ${n}`, 'debuff'); }
function power(k, n) { G.p.pw[k] = (G.p.pw[k] || 0) + n; fx(G.p, PW[k], 'buff'); }
function dec(t, k) { if (t.st[k]) { t.st[k]--; if (!t.st[k]) delete t.st[k]; } }
function draw(n) {
  const c = G.combat;
  for (let i = 0; i < n; i++) {
    if (!c.draw.length) { if (!c.disc.length) break; c.draw = shuffle(c.disc); c.disc = []; }
    if (c.hand.length >= 10) break;
    c.hand.push(c.draw.pop());
  }
}
function rollIntent(e) { e.mv = ENEMIES[e.id].ai(e, e.turn, G); e.turn++; }

function startCombat(ids, kind) {
  const en = ids.map(id => { const d = ENEMIES[id]; const hp = d.hp[0] + rnd(d.hp[1] - d.hp[0] + 1); return { u: G.uid++, id, hp, max: hp, block: 0, st: {}, turn: 0, mv: null }; });
  const p = G.p;
  p.block = 0; p.st = {}; p.pw = {};
  G.combat = { kind, en, draw: shuffle(G.deck.map(c => ({ ...c }))), hand: [], disc: [], exh: [], energy: 0, maxE: 3, turn: 0, sel: -1, busy: false, act: null, fx: [] };
  G.screen = 'combat';
  if (has('knife')) buff(p, 'str', 1);
  if (has('fang')) en.forEach(e => debuff(e, 'poison', 3));
  en.forEach(rollIntent);
  startTurn();
  if (has('mirror')) guard(10 - (p.st.dex || 0));
  render();
}
function startTurn() {
  const c = G.combat, p = G.p;
  c.turn++;
  if (!p.pw.barricade) p.block = 0;
  c.energy = c.maxE + (p.pw.club || 0) + (c.turn === 1 && has('lantern') ? 1 : 0);
  if (p.st.poison) { p.hp -= p.st.poison; fx(p, `-${p.st.poison}`, 'dmg'); dec(p, 'poison'); if (p.hp <= 0) return die(); }
  if (p.pw.fumes) alive().forEach(e => debuff(e, 'poison', p.pw.fumes));
  draw(5 + (c.turn === 1 && has('pouch') ? 2 : 0));
  if (!alive().length) { c.busy = true; render(); setTimeout(win, 600); return; }
  render();
}
function play(i, targetU) {
  const c = G.combat;
  if (!c || c.busy) return;
  const card = c.hand[i];
  if (!card) return;
  const d = CARDS[card.id], cost = costOf(card);
  if (cost == null) return toast('이 카드는 사용할 수 없습니다.');
  if (cost > c.energy) return toast('에너지가 부족합니다.');
  let T = null;
  if (d.tg) {
    const al = alive();
    if (targetU != null) T = al.find(e => e.u === targetU);
    else if (al.length === 1) T = al[0];
    if (!T) { c.sel = c.sel === i ? -1 : i; return render(); }
  }
  c.sel = -1;
  c.energy -= cost;
  c.hand.splice(i, 1);
  d.p(T, card.up, card);
  if (d.t !== 'pow') (exOf(card) ? c.exh : c.disc).push(card);
  G.stats.cards++;
  if (G.p.hp <= 0) return die();
  if (!alive().length) { c.busy = true; render(); setTimeout(win, 650); return; }
  render();
}
async function endTurn() {
  const c = G.combat, p = G.p;
  if (!c || c.busy) return;
  c.busy = true; c.sel = -1;
  if (p.pw.armor) { p.block += p.pw.armor; fx(p, `+${p.pw.armor}`, 'blk'); }
  if (has('haetae') && p.block === 0) { p.block += 6; fx(p, '+6', 'blk'); }
  c.disc.push(...c.hand); c.hand = [];
  dec(p, 'weak'); dec(p, 'vuln');
  render();
  await sleep(380);
  for (const e of alive()) {
    if (G.combat !== c) return;
    c.act = e.u;
    e.block = 0;
    if (e.st.poison) {
      e.hp -= e.st.poison; fx(e, `-${e.st.poison}`, 'dmg'); dec(e, 'poison');
      if (e.hp <= 0) { if (!e.dead) { e.dead = true; G.stats.kills++; } render(); await sleep(350); continue; }
    }
    if (e.st.ritual) { if (e.fresh) e.fresh = false; else buff(e, 'str', e.st.ritual); }
    doMove(e);
    render();
    await sleep(520);
    if (p.hp <= 0) return die();
    dec(e, 'weak'); dec(e, 'vuln');
  }
  c.act = null;
  if (!alive().length) return win();
  alive().forEach(rollIntent);
  c.busy = false;
  startTurn();
}
function doMove(e) {
  const m = e.mv, p = G.p, c = G.combat;
  if (m.block) { e.block += m.block; fx(e, `+${m.block}`, 'blk'); }
  if (m.dmg) for (let h = 0; h < (m.hits || 1); h++) { dmgTo(p, calc(e, p, m.dmg)); if (p.hp <= 0) return; }
  if (m.str) buff(e, 'str', m.str);
  if (m.ritual) { e.st.ritual = (e.st.ritual || 0) + m.ritual; e.fresh = true; fx(e, '의식', 'buff'); }
  if (m.weak) debuff(p, 'weak', m.weak);
  if (m.vuln) debuff(p, 'vuln', m.vuln);
  if (m.poison) debuff(p, 'poison', m.poison);
  if (m.wound) { for (let i = 0; i < m.wound; i++) c.disc.push(mk('wound')); fx(p, `상처 +${m.wound}`, 'debuff'); }
}
function win() {
  const c = G.combat;
  if (!c) return;
  if (has('gourd')) G.p.hp = Math.min(G.p.max, G.p.hp + 6);
  G.p.block = 0; G.p.st = {}; G.p.pw = {};
  G.combat = null;
  if (c.kind === 'boss') { G.screen = 'victory'; return render(); }
  const elite = c.kind === 'elite';
  G.reward = {
    gold: elite ? 25 + rnd(11) : 10 + rnd(11), goldTaken: false,
    cards: cardChoices(3, elite ? 'elite' : 'fight'), cardTaken: false,
    relic: elite ? randomRelic() : null, relicTaken: false,

  render();
}
function die() { G.combat = null; G.screen = 'over'; render(); }

/* ---------- map + nodes ---------- */
function go(c) {
  if (!avail().includes(c)) return;
  G.pos = { r: G.pos.r + 1, c };
  G.path.push([G.pos.r, c]);
  const t = G.map[G.pos.r][c].t, r = G.pos.r;
  if (t === 'fight') startCombat(pick(r < 3 ? ENC.easy : ENC.hard), 'fight');
  else if (t === 'elite') startCombat(pick(ENC.elite), 'elite');
  else if (t === 'boss') startCombat(pick(ENC.boss), 'boss');
  else if (t === 'rest') { G.screen = 'rest'; render(); }
  else if (t === 'shop') { genShop(); G.screen = 'shop'; render(); }
  else if (t === 'chest') { G.event = { id: 'chest', relic: randomRelic(), done: null }; G.screen = 'chest'; render(); }

function cardHTML(card, o) {

function statusHTML(t) {
  const chips = Object.entries(t.st).filter(([k, v]) => v && ST[k]).map(([k, v]) => `<span class="chip ${ST[k][1]}" title="${ST[k][2]}">${ST[k][0]} ${v}</span>`);
  if (t.pw) Object.entries(t.pw).forEach(([k, v]) => chips.push(`<span class="chip pw">${PW[k]}${k === 'barricade' ? '' : ' ' + v}</span>`));

}
function hpbar(t) {
  const pct = Math.max(0, t.hp) / t.max * 100;
  return `<div class="hpbar"><i style="width:${pct}%"></i><span class="num">${Math.max(0, t.hp)}/${t.max}</span>${t.block ? `<em class="num">${t.block}</em>` : ''}</div>`;
}
function intentHTML(e) {
  const m = e.mv;
  if (!m) return '<div class="intent"></div>';
  const parts = [];
  if (m.dmg) parts.push(`<span class="i-atk num">攻 ${calc(e, G.p, m.dmg)}${m.hits > 1 ? '×' + m.hits : ''}</span>`);
  if (m.block) parts.push(`<span class="i-def num">守 ${m.block}</span>`);
  if (m.str || m.ritual) parts.push('<span class="i-buf">強</span>');
  if (m.weak || m.vuln || m.poison || m.wound) parts.push('<span class="i-deb">呪</span>');
  return `<div class="intent">${parts.join('')}<small>${m.nm}</small></div>`;
}

function scMap() {
  const av = avail(), RH = 66, N = G.map.length, H = N * RH;
  const doneSet = new Set(G.path.map(([r, c]) => `${r},${c}`));
  const xy = (r, c) => [(c + .5) / 3 * 100 + G.map[r][c].dx, (N - 1 - r) * RH + RH / 2];
  let lines = '', nodes = '';
  G.map.forEach((row, r) => row.forEach((n, c) => {
    if (!n) return;
    const [x, y] = xy(r, c);
    if (r + 1 < N) G.map[r + 1].forEach((m, cc) => {
      if (!m || Math.abs(cc - c) > 1) return;
      const [x2, y2] = xy(r + 1, cc);
      const isDone = doneSet.has(`${r},${c}`) && doneSet.has(`${r + 1},${cc}`);
      const isOn = G.pos.r === r && G.pos.c === c && av.includes(cc);
      lines += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" class="${isDone ? 'done' : isOn ? 'on' : ''}"/>`;
    });
    const isAv = r === G.pos.r + 1 && av.includes(c);
    const st = isAv ? 'av' : doneSet.has(`${r},${c}`) ? 'done' : '';
    const here = G.pos.r === r && G.pos.c === c ? 'here' : '';
    nodes += `<button class="node t-${n.t} ${st} ${here}" style="left:${x}%;top:${y}px" title="${NODE[n.t].n}" aria-label="${r + 1}층 ${NODE[n.t].n}" ${isAv ? `onclick="A.go(${c})"` : 'disabled'}>${NODE[n.t].g}</button>`;
  }));
  return `<main>
    <div class="scene-head"><h2>저승길</h2>
      <div class="legend">${Object.values(NODE).map(v => `<span><b>${v.g}</b>${v.n}</span>`).join('')}</div></div>
    <div class="mapwrap" id="mapwrap"><div class="map" style="height:${H}px">
      <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${nodes}
    </div></div>
  </main>`;
}

function flushFx() {
  const c = G.combat;
  if (!c || !c.fx.length) return;
  const layer = document.getElementById('fxl');
  const count = {};
  for (const f of c.fx) {
    const el = document.querySelector(`[data-eid="${f.id}"]`);
    if (!el) continue;
    const r = el.querySelector('.seal').getBoundingClientRect();
    const n = count[f.id] = (count[f.id] || 0) + 1;
    const s = document.createElement('span');
    s.className = `float ${f.cls}`;
    s.textContent = f.txt;
    s.style.left = `${r.left + r.width / 2 + (n % 2 ? -1 : 1) * (n - 1) * 10}px`;
    s.style.top = `${r.top + r.height * .2 - (n - 1) * 20}px`;
    layer.appendChild(s);
    setTimeout(() => s.remove(), 950);
    if (f.cls === 'dmg') el.classList.add('hit');
  }
  c.fx = [];
}
function save() { try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* storage unavailable */ } }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

/* ---------- actions ---------- */
const A = {
  newRun() { closeModal(); newRun(); },
  cont() { const s = loadSave(); if (!s) return; G = s; if (G.combat) { G.combat.busy = false; G.combat.act = null; G.combat.fx = []; } render(); },
  go, toMap, endTurn,
  play(i) { const c = G.combat; if (c.sel >= 0 && c.sel !== i && !CARDS[c.hand[i].id].tg) c.sel = -1; play(i); },
  target(u) { const c = G.combat; if (c && c.sel >= 0) play(c.sel, u); },
  pile(k) { const c = G.combat; const names = { draw: '뽑을 더미', disc: '버린 더미', exh: '소멸한 카드' }; const cards = k === 'draw' ? [...c.draw].sort((a, b) => a.id.localeCompare(b.id)) : c[k]; viewCards(names[k], cards); },
  viewDeck() { viewCards('나의 덱', G.deck); },
  relic(id) { toast(`${RELICS[id].n}: ${RELICS[id].d}`); },
  closeModal() { closeModal(); },
  pick(i) { if (!pickCb) return; const { cards, cb } = pickCb; pickCb = null; closeModal(); cb(cards[i]); },
  takeGold() { const w = G.reward; if (w.goldTaken) return; G.p.gold += w.gold; w.goldTaken = true; render(); },
  takeRelic() { const w = G.reward; if (w.relicTaken) return; gainRelic(w.relic); w.relicTaken = true; render(); },
  takeCard(i) { const w = G.reward; if (w.cardTaken) return; G.deck.push(w.cards[i]); w.cardTaken = true; toast(`${CARDS[w.cards[i].id].n}을(를) 덱에 넣었습니다.`); render(); },
  skipCard() { G.reward.cardTaken = true; render(); },
  leaveReward() { const w = G.reward; if (!w.goldTaken) G.p.gold += w.gold; if (w.relic && !w.relicTaken) gainRelic(w.relic); toMap(); },
  rest() { const amt = Math.floor(G.p.max * .3) + (has('pillow') ? 15 : 0); G.p.hp = Math.min(G.p.max, G.p.hp + amt); toast(`체력을 ${amt} 회복했습니다.`); toMap(); },
  smith() { openPicker('강화할 부적', G.deck.filter(canUp), card => { card.up = true; toast(`${CARDS[card.id].n}+ 로 강화했습니다.`); toMap(); }, true); },
  buyCard(i) { const x = G.shop.cards[i]; if (x.sold) return; if (x.price > G.p.gold) return toast('엽전이 모자랍니다.'); G.p.gold -= x.price; x.sold = true; G.deck.push(x.c); render(); },
  buyRelic(i) { const x = G.shop.relics[i]; if (x.sold || x.price > G.p.gold) return; G.p.gold -= x.price; x.sold = true; gainRelic(x.id); render(); },
  remove() { const s = G.shop; if (s.removed || s.removePrice > G.p.gold) return; openPicker('태울 부적', G.deck, card => { G.p.gold -= s.removePrice; s.removed = true; G.deck = G.deck.filter(c => c !== card); toast(`${CARDS[card.id].n}을(를) 태웠습니다.`); render(); }, true); },
  opt(i) { const o = EVENTS[G.event.id].opts[i]; if (o.ok && !o.ok()) return; o.f(); },
  openChest() { const id = G.event.relic; if (id) { gainRelic(id); G.event.done = `${RELICS[id].n}: ${RELICS[id].d}`; } else { G.p.gold += 75; G.event.done = '엽전 75닢이 들어 있었다.'; } render(); },
};
window.A = A;
document.addEventListener('keydown', e => {
  if (!G || G.screen !== 'combat' || !document.getElementById('modal').hidden) return;
  if (e.key === 'e' || e.key === 'E') endTurn();
  else if (/^[1-9]$/.test(e.key)) A.play(+e.key - 1);
  else if (e.key === 'Escape' && G.combat.sel >= 0) { G.combat.sel = -1; render(); }
});

/* ---------- boot ---------- */
function start(data) {
  if (data && data.G) { G = data.G; if (G.combat) { G.combat.busy = false; G.combat.act = null; } }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ G }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
