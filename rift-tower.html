<title>균열의 탑</title>
<meta name="description" content="고유한 기술을 가진 네 영웅 중 하나를 골라 덱을 쌓고 탑 꼭대기의 용을 쓰러뜨리는 덱빌딩 로그라이크">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one tower-climb column — status bar, then the current scene (hero select / map / battle / shop); the hand of parchment cards sits under the battle. Single dark world by choice. */
:root {
  color-scheme: dark;
  --night: #100f1a;
  --night-2: #1a1828;
  --night-3: #26233a;
  --line: #3a3654;
  --fg: #ece6f4;
  --muted: #9e98b4;
  --parch: #efe2c2;
  --parch-2: #d8c398;
  --rift: #9a72f0;
  --rift-2: #b796ff;
  --ember: #e4683c;
  --ember-2: #f08a5d;
  --ink: #2b2230;
  --atk: #b8402f;
  --skl: #2f5a9a;
  --pow: #6a3d9a;
  --jade: #5fb59c;
  --gold: #e8b552;
  --poison: #93c552;
  --f-display: "Gugi", "Black Han Sans", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --cw: 116px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 60% 45% at 85% -10%, rgba(154, 114, 240, .16), transparent 70%),
    radial-gradient(ellipse 55% 45% at 0% 105%, rgba(228, 104, 60, .09), transparent 70%),
    var(--night);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
}
#app { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; }
.num { font-variant-numeric: tabular-nums; }
.emo { font-family: var(--f-emoji); line-height: 1; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.btn {
  border: 1px solid var(--parch-2); background: var(--parch); color: var(--ink);
  padding: .55em 1.2em; border-radius: 6px; font-weight: 700; letter-spacing: .02em;
  box-shadow: 0 2px 0 var(--parch-2);
}
.btn:hover:not(:disabled) { background: #f7ecd2; }
.btn:disabled { opacity: .45; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: var(--night-3); }
.btn.hot { background: var(--ember); color: #fff7ef; border-color: #a84624; box-shadow: 0 2px 0 #a84624; }
.btn.hot:hover:not(:disabled) { background: var(--ember-2); }
.btn.small { padding: .3em .8em; font-size: 13px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 8px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.who { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.who .emo { font-size: 22px; }
.stat { font-size: 14px; }
.stat b { color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: .06em; margin-right: 4px; }
.stat.hp .num { color: var(--ember-2); font-weight: 700; }
.stat.gold .num { color: var(--gold); font-weight: 700; }
.relics { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.relic { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--gold); background: var(--night-2); font-size: 16px; padding: 0; display: grid; place-items: center; }

/* title + hero select */
.title { display: grid; gap: 22px; padding-block: 18px 8px; }
.title header { text-align: center; display: grid; gap: 8px; justify-items: center; }
.title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(56px, 12vw, 96px); line-height: 1; color: var(--parch); letter-spacing: .06em; text-shadow: 0 0 32px rgba(154, 114, 240, .55); }
.title .sub { color: var(--muted); max-width: 34em; margin: 0; }
.heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.hero {
  --hc: var(--rift);
  display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: 10px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--hc) 16%, var(--night-2)), var(--night-2) 60%);
  border: 1px solid color-mix(in srgb, var(--hc) 45%, var(--line)); min-width: 0;
}
.hero .face { font-size: 54px; }
.hero h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--hc); }
.hero .tag { color: var(--muted); font-size: 13px; margin-top: -6px; }
.hero dl { margin: 0; display: grid; gap: 6px; font-size: 13px; }
.hero dt { color: var(--hc); font-weight: 700; font-size: 12px; letter-spacing: .04em; }
.hero dd { margin: 0; }
.hero .btn { justify-self: stretch; margin-top: 4px; }
.cont { display: flex; justify-content: center; }
.how { max-width: 40em; margin: 0 auto; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.how dt { color: var(--fg); font-weight: 700; margin-top: 8px; }
.how dd { margin: 0; }

/* card */
.card {
  --tone: var(--atk);
  width: var(--cw); height: calc(var(--cw) * 1.48); flex: none; position: relative;
  border: 0; border-radius: 8px; padding: 22px 8px 10px; color: var(--ink);
  background: radial-gradient(ellipse at 50% 38%, #fbf3dd, var(--parch) 55%, var(--parch-2));
  box-shadow: inset 0 0 0 3px var(--tone), inset 0 0 0 5px var(--parch), inset 0 0 0 6px color-mix(in srgb, var(--tone) 50%, transparent), 0 6px 14px rgba(0, 0, 0, .45);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  transition: transform .15s ease, box-shadow .15s ease, opacity .15s;
}
.card.t-skl { --tone: var(--skl); }
.card.t-pow { --tone: var(--pow); }
.card.t-curse { --tone: #5a5560; background: linear-gradient(170deg, #a59ea8, #7d7682); }
.card .cost {
  position: absolute; top: -8px; left: -8px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--tone); color: #fff; font-weight: 700; font-size: 16px;
  display: grid; place-items: center; box-shadow: 0 0 0 2px var(--night);
}
.card .cname { font-weight: 700; font-size: 13px; line-height: 1.2; color: var(--tone); }
.card.up .cname::after { content: "+"; color: #2f8a52; }
.card .art { font-family: var(--f-emoji); font-size: calc(var(--cw) * .36); line-height: 1; flex: 1; display: grid; place-items: center; }
.card .cdesc { font-size: 11.5px; line-height: 1.35; min-height: 3.6em; }
.card .ctype { position: absolute; bottom: -8px; font-size: 10px; letter-spacing: .08em; background: var(--tone); color: #fff; padding: 0 7px; border-radius: 6px; }
.hand .card:hover:not(.off), .pick .card:hover { transform: translateY(-8px); }
.card.sel { transform: translateY(-16px); box-shadow: inset 0 0 0 3px var(--tone), inset 0 0 0 5px var(--parch), 0 0 0 3px var(--gold), 0 10px 22px rgba(0, 0, 0, .55); }
.card.off { opacity: .55; filter: saturate(.6); }

/* map */
.scene-head { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.scene-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; color: var(--parch); line-height: 1.1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }
.legend .emo { margin-right: 3px; }
.mapwrap { max-height: min(68vh, 620px); overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: rgba(26, 24, 40, .6); }
.map { position: relative; max-width: 440px; margin: 0 auto; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map line { stroke: var(--line); stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.map line.on { stroke: var(--parch-2); }
.map line.done { stroke: var(--rift); stroke-dasharray: none; }
.node {
  position: absolute; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--night-2); font-size: 20px; padding: 0; display: grid; place-items: center;
  filter: grayscale(.7); opacity: .75;
}
.node.t-boss { width: 64px; height: 64px; font-size: 34px; border-color: var(--ember); filter: none; opacity: 1; }
.node.av { background: var(--parch); border-color: var(--parch); filter: none; opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
.node.av:hover { transform: translate(-50%, -50%) scale(1.12); }
.node.done { background: color-mix(in srgb, var(--rift) 45%, var(--night-2)); border-color: var(--rift); filter: none; opacity: .9; }
.node.here { box-shadow: 0 0 0 3px var(--gold); opacity: 1; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(239, 226, 194, .18); } }

/* combat */
.arena { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; min-height: 230px; padding-block: 8px; }
.mine { flex: 0 1 220px; }
.foes { flex: 1 1 300px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: flex-end; }
.ent { position: relative; width: 150px; padding: 10px; border-radius: 8px; text-align: center; display: grid; gap: 4px; justify-items: center; border: 1px solid transparent; }
.ent.big { width: 180px; }
.foe.targetable { border-color: var(--gold); background: rgba(232, 181, 82, .08); cursor: crosshair; }
.foe.acting .face { box-shadow: 0 0 0 4px var(--ember-2); }
.face-wrap { position: relative; }
.ent .face {
  width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 42px;
  background: radial-gradient(circle at 35% 30%, #3a3654, var(--night-2)); border: 2px solid var(--line); transition: box-shadow .2s;
}
.big .face { width: 96px; height: 96px; font-size: 56px; border-color: var(--ember); }
.me .face { border-color: var(--hc, var(--gold)); }
.ename { font-weight: 700; font-size: 14px; }
.hpbar { position: relative; width: 100%; height: 16px; background: #2b1a22; border-radius: 4px; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(var(--ember-2), var(--atk)); border-radius: 4px; transition: width .3s; }
.hpbar span { position: relative; font-size: 11px; line-height: 16px; color: #fff; text-shadow: 0 1px 1px #000; }
.hpbar em { position: absolute; left: -12px; top: -6px; font-style: normal; min-width: 26px; height: 26px; padding: 0 4px; display: grid; place-items: center; border-radius: 6px 6px 13px 13px; background: var(--jade); color: var(--night); font-weight: 700; font-size: 12px; }
.blocked .hpbar i { background: linear-gradient(#86ccb7, var(--jade)); }
.sts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 20px; }
.chip { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid; line-height: 17px; }
.chip.buff { color: var(--gold); border-color: rgba(232, 181, 82, .5); }
.chip.debuff { color: var(--ember-2); border-color: rgba(240, 138, 93, .5); }
.chip.poison { color: var(--poison); border-color: rgba(147, 197, 82, .5); }
.chip.burn { color: #ffb057; border-color: rgba(255, 176, 87, .5); }
.chip.ice { color: #8fd3ff; border-color: rgba(143, 211, 255, .5); }
.chip.pw { color: var(--rift-2); border-color: rgba(183, 150, 255, .45); }
.res { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.res span { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; background: color-mix(in srgb, var(--hc, var(--rift)) 22%, var(--night-3)); color: var(--fg); }
.intent { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center; min-height: 26px; }
.intent span { font-weight: 700; font-size: 13px; padding: 1px 6px; border-radius: 6px; background: var(--night-3); }
.intent .i-atk { color: var(--ember-2); }
.intent .i-def { color: var(--jade); }
.intent .i-buf { color: var(--gold); }
.intent .i-deb { color: var(--rift-2); }
.intent .i-ice { color: #8fd3ff; }
.intent small { width: 100%; color: var(--muted); font-size: 11px; }
.hint { min-height: 22px; text-align: center; color: var(--gold); font-size: 13px; }
.hud { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.energy {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; align-content: center;
  background: radial-gradient(circle at 40% 35%, var(--rift-2), var(--rift) 60%, #4c2f8f);
  color: #fff; box-shadow: 0 0 18px rgba(154, 114, 240, .5);
}
.energy > span { font-size: 24px; font-weight: 700; line-height: 1; }
.energy small { font-size: 11px; opacity: .85; line-height: 1; }
.pile { background: none; border: 1px solid var(--line); border-radius: 6px; padding: .35em .7em; font-size: 13px; color: var(--muted); }
.pile b { color: var(--fg); }
.skill {
  display: flex; align-items: center; gap: 8px; padding: .35em .8em .35em .5em; border-radius: 22px;
  border: 1.5px solid var(--hc, var(--rift)); background: color-mix(in srgb, var(--hc, var(--rift)) 18%, var(--night-2)); text-align: left;
}
.skill .emo { font-size: 22px; }
.skill b { display: block; font-size: 13px; }
.skill small { display: block; font-size: 11px; color: var(--muted); }
.skill:hover:not(:disabled) { background: color-mix(in srgb, var(--hc, var(--rift)) 30%, var(--night-2)); }
.skill:disabled { opacity: .5; filter: grayscale(.6); }
.btn.end { margin-left: auto; }
.hand { display: flex; gap: 10px; overflow-x: auto; padding: 32px 12px 18px; min-height: calc(var(--cw) * 1.48 + 54px); }
.hand .empty { color: var(--muted); margin: auto; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.hit .face { animation: shake .3s; }
#fxl { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.float { position: fixed; transform: translate(-50%, 0); font-weight: 700; font-size: 20px; text-shadow: 0 2px 3px #000; animation: rise .9s ease-out forwards; white-space: nowrap; }
.float.dmg { color: #ff8070; font-size: 24px; }
.float.blk { color: var(--jade); }
.float.heal { color: var(--poison); }
.float.buff { color: var(--gold); font-size: 15px; }
.float.debuff { color: var(--rift-2); font-size: 15px; }
@keyframes rise { to { transform: translate(-50%, -42px); opacity: 0; } }

/* panels */
.panel { max-width: 640px; margin: 12px auto 0; display: grid; gap: 16px; }
.panel h2 { font-family: var(--f-display); font-weight: 400; font-size: 36px; line-height: 1.1; color: var(--parch); }
.panel p.lead { color: var(--muted); margin: 0; max-width: 36em; }
.list { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--night-2); text-align: left; width: 100%; }
.row:hover:not(:disabled) { border-color: var(--parch-2); }
.row:disabled { opacity: .45; }
.row .ic { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: var(--night-3); }
.row .tx { flex: 1; min-width: 0; }
.row .tx small { display: block; color: var(--muted); font-size: 12.5px; }
.row .price { color: var(--gold); font-weight: 700; }
.pick { display: flex; flex-wrap: wrap; gap: 18px 14px; justify-content: center; padding-block: 12px; }
.pick > div { display: grid; gap: 10px; justify-items: center; }
.price-tag { font-size: 13px; color: var(--gold); font-weight: 700; }
.price-tag.no { color: var(--muted); }
.sold { opacity: .3; pointer-events: none; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.choice { display: grid; gap: 6px; justify-items: start; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--night-2); text-align: left; }
.choice:hover:not(:disabled) { border-color: var(--parch-2); }
.choice:disabled { opacity: .45; }
.choice .ic { font-size: 34px; }
.choice small { color: var(--muted); }
.big-emo { font-size: 64px; }
.endcard { text-align: center; justify-items: center; padding-block: 24px; }
.endcard .big-emo { font-size: 88px; }
.tally { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; color: var(--muted); }
.tally b { display: block; color: var(--fg); font-size: 22px; }

#modal { position: fixed; inset: 0; z-index: 40; background: rgba(8, 7, 14, .88); overflow-y: auto; padding: 24px 16px; }
#modal .inner { max-width: 900px; margin: 0 auto; display: grid; gap: 12px; }
#modal h3 { font-family: var(--f-display); font-weight: 400; font-size: 28px; color: var(--parch); }
#modal .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--night-3); border: 1px solid var(--parch-2); color: var(--fg); padding: 8px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 560px) {
  :root { --cw: 96px; }
  .ent { width: 128px; padding: 6px; }
  .ent.big { width: 150px; }
  .ent .face { width: 60px; height: 60px; font-size: 32px; }
  .big .face { width: 78px; height: 78px; font-size: 44px; }
  .mine { flex-basis: 100%; display: flex; justify-content: flex-start; order: 2; }
  .foes { justify-content: center; }
  .card .cdesc { font-size: 10.5px; }
  .card .cname { font-size: 12px; }
  .skill small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div id="app"></div>
<div id="fxl" aria-hidden="true"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- utils ---------- */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SAVE_KEY = 'rift-tower-run-v1';
let G = null;
let pickCb = null;
const C = () => G.combat;

/* ---------- heroes ---------- */
const HEROES = {
  knight: {
    n: '기사', e: '🤺', hp: 80, color: '#7fb0ec', tag: '방패와 반격의 수호자',
    passive: { n: '굳건함', d: '턴이 시작될 때 방어도가 모두 사라지지 않고 절반이 남습니다.' },
    skill: { n: '수호의 맹세', e: '🛡️', cd: 3, d: '방어도 10, 가시 +1', f: () => { guard(10, true); buff(G.p, 'thorns', 1); } },
    relic: 'crest', deck: ['k_strike', 'k_strike', 'k_strike', 'k_strike', 'k_strike', 'k_defend', 'k_defend', 'k_defend', 'k_defend', 'k_bash'],
  },
  mage: {
    n: '마법사', e: '🧙', hp: 62, color: '#b28cff', tag: '비전을 모아 터뜨리는 원소술사',
    passive: { n: '마력 순환', d: '매 턴 비전 ✦ 1을 얻습니다. 비전을 소모하는 주문은 모을수록 강해집니다.' },
    skill: { n: '마력 폭주', e: '🌀', cd: 4, d: '에너지 +2, 카드 1장 뽑기', f: () => { C().energy += 2; draw(1); } },
    relic: 'crystal', deck: ['m_bolt', 'm_bolt', 'm_bolt', 'm_bolt', 'm_bolt', 'm_ward', 'm_ward', 'm_ward', 'm_ward', 'm_focus'],
  },
  rogue: {
    n: '도적', e: '🥷', hp: 66, color: '#77c97b', tag: '연계와 독으로 몰아치는 암살자',
    passive: { n: '연계', d: '한 턴에 카드를 쓸 때마다 연계가 1씩 쌓이고, 마무리 카드가 그만큼 강해집니다.' },
    skill: { n: '그림자 걸음', e: '🌑', cd: 3, d: '카드 2장 뽑기, 이번 턴 다음 공격 피해 2배', f: () => { draw(2); C().dbl = true; fx(G.p, '다음 공격 2배', 'buff'); } },

  if (m.ritual) { e.st.ritual = (e.st.ritual || 0) + m.ritual; e.fresh = true; fx(e, '광기', 'buff'); }
  if (m.weak) debuff(p, 'weak', m.weak);
  if (m.vuln) debuff(p, 'vuln', m.vuln);
  if (m.poison) debuff(p, 'poison', m.poison);
  if (m.wound) { for (let i = 0; i < m.wound; i++) c.disc.push(mk('wound')); fx(p, `상처 +${m.wound}`, 'debuff'); }
}
function win() {
  const c = G.combat;
  if (!c) return;
  if (has('crest')) G.p.hp = Math.min(G.p.max, G.p.hp + 6);
  if (has('meat')) G.p.hp = Math.min(G.p.max, G.p.hp + 4);
  G.p.block = 0; G.p.st = {}; G.p.pw = {};
  G.combat = null;
  if (c.kind === 'boss') { G.screen = 'victory'; return render(); }
  const elite = c.kind === 'elite';
  G.reward = {
    gold: elite ? 25 + rnd(11) : 10 + rnd(11), goldTaken: false,
    cards: cardChoices(3, elite ? 'elite' : 'fight'), cardTaken: false,
    relic: elite ? randomRelic() : null, relicTaken: false,
  };
  G.screen = 'reward';
  render();
}
function die() { G.combat = null; G.screen = 'over'; render(); }

/* ---------- map + nodes ---------- */
function go(c) {
  if (!avail().includes(c)) return;
  G.pos = { r: G.pos.r + 1, c };
  G.path.push([G.pos.r, c]);
  const t = G.map[G.pos.r][c].t, r = G.pos.r;
  if (t === 'fight') startCombat(pick(r < 3 ? ENC.easy : ENC.hard), 'fight');
  else if (t === 'elite') startCombat(pick(ENC.elite), 'elite');
  else if (t === 'boss') startCombat(pick(ENC.boss), 'boss');
  else if (t === 'rest') { G.screen = 'rest'; render(); }
  else if (t === 'shop') { genShop(); G.screen = 'shop'; render(); }
  else if (t === 'chest') { G.event = { id: 'chest', relic: randomRelic(), done: null }; G.screen = 'chest'; render(); }
  else if (t === 'event') {
    if (Math.random() < .2) return startCombat(pick(r < 3 ? ENC.easy : ENC.hard), 'fight');
    G.event = { id: pick(Object.keys(EVENTS)), done: null };
    G.screen = 'event'; render();
  }
}
function toMap() { G.reward = null; G.shop = null; G.event = null; G.screen = 'map'; render(); }
function genShop() {
  const price = { c: 50, u: 75, r: 150 };
  const cards = [...cardChoices(3, 'fight'), ...cardChoices(2, 'elite')].map(c => ({ c, price: price[CARDS[c.id].r] + rnd(11) - 5, sold: false }));
  const relics = [];
  for (let i = 0; i < 2; i++) { const id = randomRelic(); if (id && !relics.some(x => x.id === id)) relics.push({ id, price: 140 + rnd(41), sold: false }); }
  G.shop = { cards, relics, removed: false, removePrice: 75 };
}

function scMap() {
  const av = avail(), RH = 66, N = G.map.length, H = N * RH;
  const doneSet = new Set(G.path.map(([r, c]) => `${r},${c}`));
  const xy = (r, c) => [(c + .5) / 3 * 100 + G.map[r][c].dx, (N - 1 - r) * RH + RH / 2];
  let lines = '', nodes = '';
  G.map.forEach((row, r) => row.forEach((n, c) => {
    if (!n) return;
    const [x, y] = xy(r, c);
    if (r + 1 < N) G.map[r + 1].forEach((m, cc) => {
      if (!m || Math.abs(cc - c) > 1) return;
      const [x2, y2] = xy(r + 1, cc);
      const isDone = doneSet.has(`${r},${c}`) && doneSet.has(`${r + 1},${cc}`);
      const isOn = G.pos.r === r && G.pos.c === c && av.includes(cc);
      lines += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" class="${isDone ? 'done' : isOn ? 'on' : ''}"/>`;
    });
    const isAv = r === G.pos.r + 1 && av.includes(c);
    const st = isAv ? 'av' : doneSet.has(`${r},${c}`) ? 'done' : '';
    const here = G.pos.r === r && G.pos.c === c ? 'here' : '';
    nodes += `<button class="node emo t-${n.t} ${st} ${here}" style="left:${x}%;top:${y}px" title="${NODE[n.t].n}" aria-label="${r + 1}층 ${NODE[n.t].n}" ${isAv ? `onclick="A.go(${c})"` : 'disabled'}>${NODE[n.t].e}</button>`;
  }));
  return `<main>
    <div class="scene-head"><h2>탑의 지도</h2>
      <div class="legend">${Object.values(NODE).map(v => `<span><span class="emo">${v.e}</span>${v.n}</span>`).join('')}</div></div>
    <div class="mapwrap" id="mapwrap"><div class="map" style="height:${H}px">
      <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>${nodes}
    </div></div>
  </main>`;
}

  return `<main class="panel" style="max-width:760px">
    <h2>떠돌이 상인</h2>
    <p class="lead">"금화만 있으면 뭐든 팔지." 상인이 망토를 펼쳐 물건을 보여 줍니다.</p>
    <div class="pick">${s.cards.map((x, i) => `<div class="${x.sold ? 'sold' : ''}">${cardHTML(x.c, { on: `A.buyCard(${i})` })}<span class="price-tag num ${x.price > g ? 'no' : ''}">${x.sold ? '팔림' : x.price + ' 금화'}</span></div>`).join('')}</div>
    <div class="list">
      ${s.relics.map((x, i) => `<button class="row" onclick="A.buyRelic(${i})" ${x.sold || x.price > g ? 'disabled' : ''}><span class="ic emo">${RELICS[x.id].e}</span><span class="tx">${RELICS[x.id].n}<small>${RELICS[x.id].d}</small></span><span class="price num">${x.sold ? '팔림' : x.price}</span></button>`).join('')}
      <button class="row" onclick="A.remove()" ${s.removed || s.removePrice > g || G.deck.length <= 1 ? 'disabled' : ''}><span class="ic emo">🗑️</span><span class="tx">카드 버리기<small>덱에서 카드 1장 제거${s.removed ? ' (이용함)' : ''}</small></span><span class="price num">${s.removePrice}</span></button>
    </div>
    <div style="display:flex;justify-content:flex-end"><button class="btn" onclick="A.toMap()">상점을 떠난다</button></div>
  </main>`;
}
function scEvent() {
  const ev = G.event;
  if (ev.id === 'chest') {
    return `<main class="panel endcard">
      <div class="big-emo emo">🧰</div><h2>보물 상자</h2>
      ${ev.done ? `<p class="lead">${ev.done}</p><button class="btn" onclick="A.toMap()">계속 오른다</button>`
        : `<p class="lead">계단 구석에 낡은 보물 상자가 놓여 있다.</p><button class="btn hot" onclick="A.openChest()">연다</button>`}
    </main>`;
  }
  const E = EVENTS[ev.id];
  return `<main class="panel">
    <div class="big-emo emo">${E.e}</div><h2>${E.t}</h2>
    <p class="lead">${ev.done || E.txt}</p>
    ${ev.done ? '<div><button class="btn" onclick="A.toMap()">계속 오른다</button></div>'
      : `<div class="list">${E.opts.map((o, i) => `<button class="row" onclick="A.opt(${i})" ${o.ok && !o.ok() ? 'disabled' : ''}><span class="tx"><b>${o.l}</b>${o.s ? `<small>${o.s}</small>` : ''}</span></button>`).join('')}</div>`}
  </main>`;
}
function scEnd(won) {
  const H = HEROES[G.hero];
  return `<main class="panel endcard">
    <div class="big-emo emo">${won ? '🏆' : '🪦'}</div>
    <h2>${won ? '균열의 용을 쓰러뜨렸다' : `${H.n}이(가) 쓰러졌다`}</h2>
    <p class="lead">${won ? '균열이 닫히고 탑에 아침 햇살이 스며듭니다.' : `${Math.max(1, G.pos.r + 1)}층에서 여정이 끝났습니다. 다른 영웅으로 다시 도전해 보세요.`}</p>
    <div class="tally">
      <span><b class="num">${G.pos.r + 1}</b>도달한 층</span>
      <span><b class="num">${G.stats.kills}</b>쓰러뜨린 적</span>
      <span><b class="num">${G.stats.cards}</b>쓴 카드</span>
      <span><b class="num">${G.deck.length}</b>덱 크기</span>
    </div>
    <button class="btn hot" onclick="A.title()">영웅 고르기</button>
  </main>`;
}

function render() {
  const app = document.getElementById('app');
  if (!G || G.screen === 'title') { app.innerHTML = scTitle(); return; }
  const s = G.screen;
  const body = s === 'map' ? scMap() : s === 'combat' ? scCombat() : s === 'reward' ? scReward() : s === 'rest' ? scRest()
    : s === 'shop' ? scShop() : (s === 'event' || s === 'chest') ? scEvent() : s === 'victory' ? scEnd(true) : scEnd(false);
  app.innerHTML = topbar() + body;
  if (s === 'map') {
    const w = document.getElementById('mapwrap');
    const y = (G.map.length - 1 - (G.pos.r + 1)) * 66;
    w.scrollTop = Math.max(0, y - w.clientHeight / 2 + 33);
  }
  flushFx();
  save();
}
function flushFx() {
  const c = G.combat;
  if (!c || !c.fx.length) return;
  const layer = document.getElementById('fxl');
  const count = {};
  for (const f of c.fx) {
    const el = document.querySelector(`[data-eid="${f.id}"]`);
    if (!el) continue;
    const r = el.querySelector('.face').getBoundingClientRect();
    const n = count[f.id] = (count[f.id] || 0) + 1;
    const s = document.createElement('span');
    s.className = `float ${f.cls}`;
    s.textContent = f.txt;
    s.style.left = `${r.left + r.width / 2 + (n % 2 ? -1 : 1) * (n - 1) * 10}px`;
    s.style.top = `${r.top + r.height * .2 - (n - 1) * 20}px`;
    layer.appendChild(s);
    setTimeout(() => s.remove(), 950);
    if (f.cls === 'dmg') el.classList.add('hit');
  }
  c.fx = [];
}
function save() { try { if (G) localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* storage unavailable */ } }
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

/* ---------- actions ---------- */
const A = {
  newRun(h) { closeModal(); newRun(h); },
  title() { G = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } render(); },
  cont() { const s = loadSave(); if (!s) return; G = s; if (G.combat) { G.combat.busy = false; G.combat.act = null; G.combat.fx = []; G.combat.mult = 1; } render(); },
  go, toMap, endTurn,
  skill: useSkill,
  play(i) { const c = G.combat; if (c.sel >= 0 && c.sel !== i && !CARDS[c.hand[i].id].tg) c.sel = -1; play(i); },
  target(u) { const c = G.combat; if (c && c.sel >= 0) play(c.sel, u); },
  pile(k) { const c = G.combat; const names = { draw: '뽑을 더미', disc: '버린 더미', exh: '소멸한 카드' }; const cards = k === 'draw' ? [...c.draw].sort((a, b) => a.id.localeCompare(b.id)) : c[k]; viewCards(names[k], cards); },
  viewDeck() { viewCards('나의 덱', G.deck); },
  relic(id) { toast(`${RELICS[id].n}: ${RELICS[id].d}`); },
  closeModal() { closeModal(); },
  pick(i) { if (!pickCb) return; const { cards, cb } = pickCb; pickCb = null; closeModal(); cb(cards[i]); },
  takeGold() { const w = G.reward; if (w.goldTaken) return; G.p.gold += w.gold; w.goldTaken = true; render(); },
  takeRelic() { const w = G.reward; if (w.relicTaken) return; gainRelic(w.relic); w.relicTaken = true; render(); },
  takeCard(i) { const w = G.reward; if (w.cardTaken) return; G.deck.push(w.cards[i]); w.cardTaken = true; toast(`${CARDS[w.cards[i].id].n}을(를) 덱에 넣었습니다.`); render(); },
  skipCard() { G.reward.cardTaken = true; render(); },
  leaveReward() { const w = G.reward; if (!w.goldTaken) G.p.gold += w.gold; if (w.relic && !w.relicTaken) gainRelic(w.relic); toMap(); },
  rest() { const amt = Math.floor(G.p.max * .3) + (has('pillow') ? 15 : 0); G.p.hp = Math.min(G.p.max, G.p.hp + amt); toast(`체력을 ${amt} 회복했습니다.`); toMap(); },
  smith() { openPicker('강화할 카드', G.deck.filter(canUp), card => { card.up = true; toast(`${CARDS[card.id].n}+ 로 강화했습니다.`); toMap(); }, true); },
  buyCard(i) { const x = G.shop.cards[i]; if (x.sold) return; if (x.price > G.p.gold) return toast('금화가 모자랍니다.'); G.p.gold -= x.price; x.sold = true; G.deck.push(x.c); render(); },
  buyRelic(i) { const x = G.shop.relics[i]; if (x.sold || x.price > G.p.gold) return; G.p.gold -= x.price; x.sold = true; gainRelic(x.id); render(); },
  remove() { const s = G.shop; if (s.removed || s.removePrice > G.p.gold) return; openPicker('버릴 카드', G.deck, card => { G.p.gold -= s.removePrice; s.removed = true; G.deck = G.deck.filter(c => c !== card); toast(`${CARDS[card.id].n}을(를) 버렸습니다.`); render(); }, true); },
  opt(i) { const o = EVENTS[G.event.id].opts[i]; if (o.ok && !o.ok()) return; o.f(); },
  openChest() { const id = G.event.relic; if (id) { gainRelic(id); G.event.done = `${RELICS[id].n}: ${RELICS[id].d}`; } else { G.p.gold += 75; G.event.done = '금화 75닢이 들어 있었다.'; } render(); },
};
window.A = A;
document.addEventListener('keydown', e => {
  if (!G || G.screen !== 'combat' || !document.getElementById('modal').hidden) return;
  if (e.key === 'e' || e.key === 'E') endTurn();
  else if (e.key === 'q' || e.key === 'Q') useSkill();
  else if (/^[1-9]$/.test(e.key)) A.play(+e.key - 1);
  else if (e.key === 'Escape' && G.combat.sel >= 0) { G.combat.sel = -1; render(); }
});

/* ---------- boot ---------- */
function start(data) {
  if (data && data.G && data.G.hero) { G = data.G; if (G.combat) { G.combat.busy = false; G.combat.act = null; G.combat.mult = 1; } }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ G }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
